# Throwaway Postgres for the backend integration tests (npm run test:db).
# No volume on purpose: the suite truncates every table anyway.
services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rewatch
      POSTGRES_PASSWORD: rewatch
      POSTGRES_DB: rewatch_test
    ports:
      - '55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    # Lets `up --wait` return only once the server accepts connections.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rewatch -d rewatch_test']
      interval: 2s
      timeout: 3s
      retries: 15
